
name: Auto Pluto Update

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Restore movie metadata cache
        uses: actions/cache/restore@v4
        with:
          path: output/*.cache
          key: plutotv-vod-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            plutotv-vod-${{ runner.os }}-

      - name: Run scraper
        run: node index.js

      - name: Save movie metadata cache
        uses: actions/cache/save@v4
        with:
          path: output/*.cache
          key: plutotv-vod-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      
      - name: Commit files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git rm --cached --ignore-unmatch output/*.cache
          git add -f output/*.m3u8 output/*.xml
          git diff --cached --quiet || git commit -m "Auto update playlist"
          git push
